
#SCIENCE

[PUC]
Pre-University College (PUC) is a two-year course that acts as a bridge between high school and university education.
It offers specialized streams like Science, Commerce, and Arts, helping students build a strong foundation for their
future careers. PUC equips students with essential skills and knowledge, preparing them for higher education or
professional courses. It s a crucial step in shaping your academic and career journey.

[Science]
The Science course at the pre-university level is designed to spark curiosity and build a strong foundation for students
who are passionate about exploring how the world works. It helps bridge the transition from school to higher
education by offering essential knowledge and skills in core subjects like Physics, Chemistry, Mathematics, and
Biology, Computer Sciences, Electronics . This course fosters critical thinking, problem-solving, and analytical
abilities, which are key for success in advanced studies. Whether you are aiming for a career in engineering, medicine,
research, or technology, the Science stream equips you with the tools to excel in any of these fields.

[PCMB]
PCMB (Physics, Chemistry, Mathematics, Biology)
This is a popular choice for students who want to keep their career options open for both
engineering and medical fields.

[PCMC]
PCMC (Physics, Chemistry, Mathematics, Computer Science)
Widely offered, this combination is ideal for students aiming for careers in engineering, IT,
and technology sectors.

[PCME]
PCME (Physics, Chemistry, Mathematics, Electronics)
Frequently available in colleges, this combination is popular among students interested in
electronics, electrical engineering, and related technical fields.

[Bachelor of Medicine and Bachelor of Surgery (MBBS)]
MBBS is a 5-6 year undergraduate program that prepares students for a career in medicine. It combines theoretical
learning in subjects like anatomy, physiology, and pharmacology with hands-on clinical training. After completing the
course, graduates must undergo a mandatory internship before practicing medicine. MBBS serves as the foundation
for specialization in various medical fields.

[Bachelor of Dental Surgery (BDS)]
BDS is a 5-year undergraduate program that equips students with the skills needed to diagnose, treat, and prevent
dental and oral health issues. The course includes theoretical knowledge in subjects like anatomy, physiology, and
dental surgery, alongside practical training in clinical settings. Graduates of BDS can work as general dentists or
pursue specialization in fields such as orthodontics, periodontics, or oral surgery. After completing the program,
students must obtain a license to practice dentistry.

[Bachelor of Ayurvedic Medicine and Surgery (BAMS)]
Bachelor of Ayurvedic Medicine and Surgery (BAMS) is a 5.5-year undergraduate program that blends traditional
Ayurvedic practices with modern medical science. It prepares students to diagnose, treat, and prevent health issues
using natural and holistic approaches. BAMS graduates can work as Ayurvedic doctors, offering alternative medicine
therapies, or pursue further specialization in various Ayurvedic fields.

[Bachelor of Homeopathic Medicine and Surgery (BHMS)]
Bachelor of Homeopathic Medicine and Surgery (BHMS) is a 5.5-year program that focuses on diagnosing and
treating diseases using homeopathic remedies. It combines theoretical knowledge with practical training in holistic
healthcare. Graduates can practice as homeopathic doctors or specialize further in the field.

[Bachelor of Naturopathy and Yogic Sciences (BNYS)]
Bachelor of Naturopathy and Yogic Sciences (BNYS) is a 5.5-year program that integrates naturopathy and yoga for
holistic health. Students learn natural healing methods, including herbal medicine, diet, and yoga therapy. Graduates
can work as naturopaths or yoga therapists, promoting overall wellness through non-invasive treatments.

[Bachelor of Physiotherapy(BPT)]
Bachelor of Physiotherapy (BPT) is a 4-year undergraduate program that focuses on restoring and improving physical
mobility and functionality. The course covers therapeutic techniques for rehabilitation, pain management, and injury
prevention. Graduates can work as physiotherapists in various healthcare settings. BPT prepares students to enhance
the quality of life through physical therapy.

[B.Sc. Nursing]
B.Sc. Nursing is a 4-year undergraduate program that trains students in nursing practice and healthcare management.
The course covers medical subjects, patient care, and clinical training. Graduates are equipped to work as registered
nurses in hospitals, clinics, and healthcare settings. B.Sc. Nursing prepares students to provide compassionate care and
promote health and wellness.

[Bachelor of Pharmacy(B.Pharm)]
Bachelor of Pharmacy (B.Pharm) is a 4-year undergraduate program that focuses on the study of medicines, drug
formulation, and healthcare. Students learn about pharmacology, pharmaceutical chemistry, and clinical pharmacy.
Graduates can work in drug research, manufacturing, or as licensed pharmacists. B.Pharm prepares professionals to
contribute to healthcare and the pharmaceutical industry.

[Doctor of Pharmacy(Pharm D)]
Doctor of Pharmacy (Pharm D) is a 6-year professional program that focuses on clinical pharmacy, drug
therapy, and patient care. It includes in-depth studies of pharmacology, pharmacy practice, and a mandatory
internship. Graduates are trained to provide expert advice on medication use and therapy management.
Pharm D prepares students for roles in healthcare, research, and pharmaceutical industries.

[B.Sc. Medical Laboratory Technolog]
B.Sc. Medical Laboratory Technology is a 3-year undergraduate program that trains students in diagnostic testing and
laboratory procedures. It covers subjects like microbiology, pathology, and biochemistry, with hands-on training in
medical labs. Graduates can work as lab technologists in hospitals, clinics, and diagnostic centers. This course plays a
vital role in supporting accurate medical diagnoses and treatments.

[B.Sc. Radiology and Imaging Technology]
B.Sc. Radiology and Imaging Technology is a 3-year undergraduate program that focuses on medical imaging
techniques like X-rays, CT scans, and MRIs. Students gain theoretical knowledge and practical skills in radiology
equipment and diagnostic procedures. Graduates can work as radiology technologists in hospitals, diagnostic centers,
and healthcare facilities. The course plays a key role in supporting accurate medical diagnoses.

[B.Sc. Operation Theatre Technology]
B.Sc. Operation Theatre Technology is a 3-year undergraduate program that trains students to assist in surgical
procedures and manage operation theatre equipment. The course covers subjects like surgical instruments, sterilization
techniques, and patient monitoring. Graduates can work as operation theatre technologists in hospitals and surgical
centers. This program ensures safe and efficient support during surgeries.

[ B.Sc. Anesthesia Technology]
B.Sc. Anesthesia Technology is a 3-year undergraduate program that trains students in administering anesthesia and
monitoring patients during surgical procedures. The course covers anesthesia techniques, equipment handling, and
patient care. Graduates can work as anesthesia technologists in hospitals, surgical units, and critical care settings. This
program plays a crucial role in ensuring patient safety during surgeries.

[B.Sc. Cardiovascular Technology]
B.Sc. Cardiovascular Technology is a 3-year undergraduate program that focuses on diagnosing and treating heart and
vascular conditions. Students learn about cardiac care, diagnostic equipment, and interventional procedures. Graduates
can work as cardiovascular technologists in hospitals, clinics, and cardiac care units. This program plays a vital role in
supporting cardiovascular health and patient care.

[B.Sc. Respiratory Therapy]
B.Sc. Respiratory Therapy is a 3-year undergraduate program that trains students to diagnose and manage respiratory
disorders. The course covers critical care, pulmonary rehabilitation, and the use of advanced respiratory equipment.
Graduates can work as respiratory therapists in hospitals, ICUs, and pulmonary care centers. This program is essential
for improving respiratory health and patient outcomes.

[ B.Sc. Audiology and Speech Therapy]
B.Sc. Audiology and Speech Therapy is a 3-year undergraduate program that focuses on diagnosing and treating
hearing, speech, and communication disorders. Students learn about audiometry, speech therapy techniques, and
rehabilitation methods. Graduates can work as audiologists or speech therapists in hospitals, clinics, and special
education centers. This program helps improve communication abilities and quality of life.

[B.Sc. Optometry]
B.Sc. Optometry is a 4-year undergraduate program that trains students to diagnose and manage vision problems and
eye-related disorders. The course covers clinical optometry, ocular diseases, and the fitting of lenses. Graduates can
work as optometrists in eye clinics, hospitals, or optical centers. This program plays a key role in promoting eye health
and improving vision care.

[B.Sc. Nutrition and Dietetics]
B.Sc. Nutrition and Dietetics is a 3-year undergraduate program that focuses on the science of nutrition, healthy
eating, and diet planning. Students learn about food, metabolism, and the role of nutrition in health and disease
management. Graduates can work as dietitians, nutritionists, or in healthcare settings promoting healthy living. This
program plays a vital role in improving public health through proper nutrition.

[B.Sc. Occupational Therapy]
B.Sc. Occupational Therapy is a 3-year undergraduate program that trains students to help individuals with physical,
mental, or developmental conditions improve daily functioning. The course covers therapeutic techniques, patient
assessments, and rehabilitation practices. Graduates can work as occupational therapists in hospitals, rehabilitation
centers, and clinics. This program is essential for enhancing patients independence and quality of life.

[B.Sc. Neuroscience Technology]
B.Sc. Neuroscience Technology is a 3-year undergraduate program that focuses on the study of the nervous system
and neurological disorders. Students learn about diagnostic techniques, brain function, and neuroimaging tools.
Graduates can work as neuroscience technologists in hospitals, research labs, and diagnostic centers. This program
plays a critical role in advancing neurological healthcare and research.

[B.Sc. Dialysis Technology]
B.Sc. Dialysis Technology is a 3-year undergraduate program that focuses on the principles and practices of dialysis
treatment for patients with kidney failure. Students learn about renal care, dialysis procedures, and the operation of
dialysis machines. Graduates can work as dialysis technicians in hospitals, dialysis centers, and healthcare facilities.
This program is essential for providing life-saving care to individuals with kidney conditions.

[B.Sc. Neurophysiology Technology]
B.Sc. Neurophysiology Technology is a 3-year undergraduate program that focuses on studying the electrical activity
of the brain and nervous system. Students learn about neurodiagnostic techniques, EEG, and other neurophysiological
tests. Graduates can work as neurophysiology technologists in hospitals, research centers, and diagnostic labs. This
program plays a crucial role in diagnosing neurological disorders and advancing brain health.

[B.Sc. Perfusion Technology]
B.Sc. Perfusion Technology is a 3-year undergraduate program that focuses on the operation of heart-lung machines
and supporting cardiac and surgical procedures. Students learn about perfusion techniques, patient monitoring, and
equipment management. Graduates can work as perfusionists in hospitals, cardiac surgery units, and healthcare
facilities. This program is essential for ensuring the success of complex heart surgeries and critical care.

[B.Sc. Emergency and Trauma Care Technology]
B.Sc. Emergency and Trauma Care Technology is a 3-year undergraduate program that trains students in providing
urgent medical care in emergency situations. The course covers trauma management, first aid, patient stabilization,
and life-saving techniques. Graduates can work as emergency care technologists in hospitals, trauma centers, and
disaster response units. This program is vital for supporting rapid medical interventions in critical situations.

[B.Sc. Orthopedic Technology]
B.Sc. Orthopedic Technology is a 3-year undergraduate program that focuses on the management and treatment of
musculoskeletal disorders. Students learn about orthopedic equipment, casting, splinting, and rehabilitation
techniques. Graduates can work as orthopedic technologists in hospitals, clinics, and rehabilitation centers. This
program plays a key role in supporting patients with bone and joint-related conditions.

[B.Sc. Clinical Research]
B.Sc. Clinical Research is a 3-year undergraduate program that focuses on the design, conduct, and analysis of clinical
trials and studies. Students learn about research methodologies, data analysis, and ethical guidelines in clinical
research. Graduates can work in pharmaceutical companies, research organizations, or healthcare institutions. This
program plays a vital role in advancing medical treatments and healthcare innovations.

[ B.Sc. Critical Care Technology]
B.Sc. Critical Care Technology is a 3-year undergraduate program that trains students to manage and monitor
critically ill patients. The course covers advanced medical equipment, patient care techniques, and life support
systems. Graduates can work in intensive care units (ICUs), emergency departments, and healthcare facilities. This
program is essential for providing life-saving care in critical medical situations

[B.Sc. Public Health]
B.Sc. Public Health is a 3-year undergraduate program that focuses on promoting community health and preventing
diseases. Students learn about health policies, epidemiology, environmental health, and health education. Graduates
can work in government health agencies, NGOs, or healthcare organizations. This program plays a key role in
improving public health and wellbeing.

[B.Sc. Speech and Language Pathology]
B.Sc. Speech and Language Pathology is a 3-year undergraduate program that focuses on diagnosing and treating
speech, language, and communication disorders. Students learn about speech therapy techniques, audiology, and
rehabilitation methods. Graduates can work as speech-language pathologists in hospitals, clinics, and special
education centers. This program helps improve communication and quality of life for individuals with speech
challenges.

[B.Sc. Ophthalmic Technology]
B.Sc. Ophthalmic Technology is a 3-year undergraduate program that trains students in diagnosing and treating eyerelated conditions. The course covers techniques in eye examination, vision testing, and the use of ophthalmic
equipment. Graduates can work as ophthalmic technologists in eye hospitals, clinics, and healthcare centers. This
program plays a crucial role in supporting eye care and improving vision health.

[B.Sc. Health Information Management]
B.Sc. Health Information Management is a 3-year undergraduate program that focuses on managing healthcare data
and information systems. Students learn about medical coding, health data analysis, and electronic health records.
Graduates can work in hospitals, clinics, and healthcare organizations, ensuring efficient management of health
information. This program plays a key role in improving healthcare delivery through accurate data management.

[B.Sc. Cardiac Care Technology]
B.Sc. Cardiac Care Technology is a 3-year undergraduate program that trains students in diagnosing and treating
heart-related conditions. The course covers cardiology, patient monitoring, and the operation of cardiac care
equipment. Graduates can work as cardiac care technologists in hospitals, clinics, and cardiac units. This program
plays a crucial role in supporting heart health and patient care.

[B.Sc. Medical Imaging Technology]
B.Sc. Medical Imaging Technology is a 3-year undergraduate program that focuses on diagnostic imaging techniques
like X-rays, CT scans, and MRIs. Students learn about image processing, equipment handling, and patient care.
Graduates can work as medical imaging technologists in hospitals, diagnostic centers, and healthcare facilities. This
program plays a key role in supporting accurate medical diagnoses through imaging.

[B.Sc. Respiratory Therapy Technology]
B.Sc. Respiratory Therapy Technology is a 3-year undergraduate program that focuses on diagnosing and
treating respiratory disorders. Students learn about ventilators, oxygen therapy, and pulmonary rehabilitation
techniques. Graduates can work as respiratory therapists in hospitals, ICU units, and pulmonary care centers.
This program plays a vital role in improving patients respiratory health and overall well-being.

[B.Sc. Renal Dialysis Technolog]
B.Sc. Renal Dialysis Technology is a 3-year undergraduate program that focuses on the management and operation of
dialysis equipment for patients with kidney failure. Students learn about dialysis procedures, patient care, and renal
health. Graduates can work as dialysis technicians in hospitals, dialysis centers, and healthcare facilities. This program
plays a crucial role in providing life-saving treatments for patients with renal conditions.

[Bachelor of Audiology and Speech-Language Pathology(BASLP)]
Bachelor of Audiology and Speech-Language Pathology (BASLP) is a 4-year undergraduate program focused on
diagnosing and treating speech, language, and hearing disorders. Students learn about speech therapy, audiology, and
rehabilitation techniques. Graduates can work as speech-language pathologists and audiologists in hospitals, clinics,
and schools. This program helps improve communication abilities and quality of life for individuals with speech and
hearing challenges.

[B.Sc. Medical Microbiology]
B.Sc. Medical Microbiology is a 3-year undergraduate program that focuses on the study of microorganisms and their
role in human diseases. Students learn about microbiological techniques, diagnostics, and infection control. Graduates
can work in hospitals, diagnostic labs, and research institutions. This program is essential for understanding and
combating infectious diseases.

[B.Sc. Medical Biochemistry]
B.Sc. Medical Biochemistry is a 3-year undergraduate program that focuses on the chemical processes within the
human body and their relation to health and disease. Students learn about biochemistry techniques, molecular biology,
and diagnostic methods. Graduates can work in hospitals, research labs, and healthcare institutions. This program
plays a key role in understanding disease mechanisms and supporting medical diagnoses.

[B.Sc. Medical Genetics]
B.Sc. Medical Genetics is a 3-year undergraduate program that focuses on the study of genes, heredity, and genetic
disorders. Students learn about genetic counseling, diagnostic techniques, and the role of genetics in disease
prevention and treatment. Graduates can work in research, hospitals, and diagnostic centers. This program is essential
for advancing personalized medicine and genetic healthcare.

[Bachelor of Public Health (BPH)]
Bachelor of Public Health (BPH) is a 3-year undergraduate program focused on promoting community health and
preventing diseases. Students learn about epidemiology, health policies, environmental health, and health education.
Graduates can work in government health agencies, NGOs, and healthcare organizations. This program plays a crucial
role in improving public health and wellbeing on a large scale.

[B.Sc. Biotechnology]
B.Sc. Biotechnology is a 3-year undergraduate program that focuses on the use of biological systems and organisms to
develop innovative products and solutions. Students learn about molecular biology, genetics, and bioprocessing
techniques. Graduates can work in research, healthcare, agriculture, and pharmaceutical industries. This program plays
a key role in advancing biotechnology applications in various fields.

[B.Sc. Microbiology]
B.Sc. Microbiology is a 3-year undergraduate program that focuses on the study of microorganisms and their impact
on health, environment, and industries. Students learn about microbiological techniques, pathogens, and infection
control. Graduates can work in research, healthcare, and food or pharmaceutical industries. This program is vital for
understanding microbial life and its role in various fields.

[B.Sc. Genetics]
B.Sc. Genetics is a 3-year undergraduate program that focuses on the study of genes, heredity, and genetic variation in
living organisms. Students learn about molecular genetics, gene expression, and genetic disorders. Graduates can work
in research, healthcare, and biotechnology sectors. This program plays a crucial role in understanding inheritance
patterns and advancing genetic research

[B.Sc. Botany]
B.Sc. Botany is a 3-year undergraduate program that focuses on the study of plants, their structure, function, and
ecological significance. Students learn about plant biology, taxonomy, genetics, and environmental science. Graduates
can work in research, agriculture, forestry, and environmental conservation. This program plays a vital role in
understanding plant life and its impact on the environment.

[B.Sc. Zoology]
B.Sc. Zoology is a 3-year undergraduate program that focuses on the study of animals, their behavior, physiology, and
evolution. Students learn about animal classification, ecology, and genetics. Graduates can work in research, wildlife
conservation, and environmental agencies. This program plays a key role in understanding animal life and
biodiversity.

[B.Sc. Biochemistry]
B.Sc. Biochemistry is a 3-year undergraduate program that focuses on the chemical processes and molecular
mechanisms within living organisms. Students learn about enzymes, metabolic pathways, and cellular functions.
Graduates can work in research, healthcare, and pharmaceutical industries. This program plays a crucial role in
understanding the biochemical basis of health and disease.

[B.Sc. Environmental Science]
B.Sc. Environmental Science is a 3-year undergraduate program that focuses on the study of the environment and the
impact of human activities on ecosystems. Students learn about environmental management, pollution control, and
sustainability. Graduates can work in research, government agencies, and environmental NGOs. This program plays a
vital role in addressing global environmental challenges and promoting sustainable practices.

[B.Sc. Agriculture]
B.Sc. Agriculture is a 3-year undergraduate program that focuses on the science of farming, crop production, and
livestock management. Students learn about soil science, plant breeding, agricultural economics, and pest control.
Graduates can work in farming, agribusiness, and research sectors. This program plays a crucial role in advancing
sustainable agricultural practices and food security.

[B.Sc. Horticulture]
B.Sc. Horticulture is a 3-year undergraduate program focused on the science of growing fruits, vegetables, flowers,
and ornamental plants. Students learn about plant breeding, soil management, and pest control techniques. Graduates
can work in nurseries, botanical gardens, and agricultural research. This program plays a vital role in enhancing food
production and promoting sustainable gardening practices.

[B.Sc. Forestry]
B.Sc. Forestry is a 3-year undergraduate program that focuses on the management and conservation of forests and
natural resources. Students learn about tree biology, forest ecology, wildlife management, and environmental
sustainability. Graduates can work in forestry departments, wildlife conservation, and environmental agencies. This
program plays a crucial role in preserving forests and promoting sustainable land management.

[B.Sc. Fisheries Science]
B.Sc. Fisheries Science is a 3-year undergraduate program focused on the study of aquatic life, fish breeding, and
sustainable fishing practices. Students learn about fish biology, aquatic ecosystems, and fisheries management.
Graduates can work in fisheries, aquaculture industries, and environmental research. This program plays a vital role in
conserving aquatic resources and promoting sustainable fish production.

[Bachelor of Veterinary Science (BVSc)]
Bachelor of Veterinary Science (BVSc) is a 5-year undergraduate program that trains students to diagnose and treat
animal diseases. Students learn about animal anatomy, physiology, surgery, and healthcare management. Graduates
can work as veterinarians in clinics, farms, and wildlife conservation centers. This program plays a crucial role in
ensuring the health and well-being of animals.

[ B.Sc. Sericulture]
B.Sc. Sericulture is a 3-year undergraduate program focused on the study of silk production and the cultivation of
silkworms. Students learn about sericulture practices, silk technology, and the processing of raw silk. Graduates can
work in the textile industry, sericulture farms, and research organizations. This program plays a vital role in promoting
sustainable silk production and supporting the textile industry.

[B.Sc. Food Science and Nutrition]
B.Sc. Food Science and Nutrition is a 3-year undergraduate program that focuses on the study of food, its nutrients,
and their impact on human health. Students learn about food processing, nutrition, and diet planning. Graduates can
work in food industries, healthcare, and research organizations. This program plays a key role in promoting healthy
eating habits and improving public health

[B.Sc. Marine Biology]
B.Sc. Marine Biology is a 3-year undergraduate program that focuses on the study of marine organisms and their
ecosystems. Students learn about oceanography, marine ecology, and conservation techniques. Graduates can work in
research, environmental organizations, and marine conservation. This program plays a vital role in understanding and
preserving marine life and ecosystems.

[B.Sc. Plant Science]
B.Sc. Plant Science is a 3-year undergraduate program that focuses on the study of plants, their growth, development,
and ecological significance. Students learn about plant biology, genetics, and environmental interactions. Graduates
can work in agriculture, research, and environmental conservation. This program plays a key role in advancing
sustainable farming and understanding plant ecosystems.

[B.Sc. Animal Science]
B.Sc. Animal Science is a 3-year undergraduate program focused on the study of animal biology, nutrition, breeding,
and health. Students learn about livestock management, animal behavior, and welfare practices. Graduates can work in
agriculture, animal breeding, and research sectors. This program plays a vital role in improving animal husbandry and
food production systems.

[ B.Sc. Wildlife Science]
B.Sc. Wildlife Science is a 3-year undergraduate program that focuses on the study of wildlife conservation,
ecology, and management. Students learn about animal behavior, biodiversity, and environmental
protection. Graduates can work in wildlife conservation, national parks, and research organizations. This
program plays a crucial role in preserving wildlife and natural habitats

[B.Sc. Ecology and Environmental Biology]
B.Sc. Ecology and Environmental Biology is a 3-year undergraduate program that focuses on the study of ecosystems,
biodiversity, and environmental conservation. Students learn about ecological principles, environmental challenges,
and sustainable practices. Graduates can work in research, conservation, and environmental policy sectors. This
program plays a key role in promoting environmental sustainability and ecosystem health

[B.Sc. Soil Science]
B.Sc. Soil Science is a 3-year undergraduate program focused on the study of soil properties, fertility, and
conservation. Students learn about soil management, land use, and environmental sustainability. Graduates can work
in agriculture, environmental consulting, and research. This program plays a crucial role in promoting sustainable
farming practices and soil conservation.

[B.Sc. Bioinformatics]
B.Sc. Bioinformatics is a 3-year undergraduate program that combines biology, computer science, and data analysis to
study biological data. Students learn about genomic sequencing, computational tools, and bioinformatics applications.
Graduates can work in healthcare, research, and biotechnology industries. This program plays a vital role in advancing
personalized medicine and biological research.


[B.Sc. Biomedical Science]
B.Sc. Biomedical Science is a 3-year undergraduate program focused on the study of the human body, disease
mechanisms, and laboratory diagnostics. Students learn about microbiology, pathology, and medical research
techniques. Graduates can work in healthcare, research institutions, and clinical laboratories. This program plays a
vital role in advancing medical science and improving patient care.

[B.Sc. Applied Biology]
B.Sc. Applied Biology is a 3-year undergraduate program that focuses on the practical application of
biological principles in various industries. Students learn about biotechnology, molecular biology, and
environmental science. Graduates can work in research, pharmaceuticals, and environmental sectors. This
program plays a key role in advancing biological research and innovative solutions in healthcare and
industry.

[B.Sc. Agricultural Biotechnology]
B.Sc. Agricultural Biotechnology is a 3-year undergraduate program that combines biotechnology and agricultural
sciences. Students learn about genetic engineering, crop improvement, and sustainable farming techniques. Graduates
can work in agriculture, research, and biotechnology industries. This program plays a crucial role in advancing food
security and sustainable agricultural practices.

[B.Sc. Agricultural Economics]
B.Sc. Agricultural Biotechnology is a 3-year undergraduate program that blends biotechnology with agricultural
sciences to enhance crop production and sustainability. Students learn about genetic modification, plant breeding, and
pest resistance. Graduates can pursue careers in agriculture, research, and biotechnology sectors. This program plays a
key role in advancing food production and environmental sustainability.

[B.Sc. Dairy Technology]
B.Sc. Dairy Technology is a 3-year undergraduate program focused on the science of milk production, processing, and
dairy product manufacturing. Students learn about food safety, quality control, and dairy management. Graduates can
work in dairy farms, food industries, and research. This program plays a crucial role in enhancing dairy production
and ensuring food quality.

[B.Sc. Poultry Science]
B.Sc. Poultry Science is a 3-year undergraduate program focused on the study of poultry farming, nutrition, and
disease management. Students learn about breeding, hatchery operations, and sustainable poultry production.
Graduates can work in poultry farms, research, and agribusiness industries. This program plays a vital role in
advancing poultry health and enhancing food production.


[B.Sc. Crop Science]
B.Sc. Crop Science is a 3-year undergraduate program that focuses on the study of crop production, management, and
improvement techniques. Students learn about sustainable farming, soil management, and plant breeding. Graduates
can work in agriculture, research, and agribusiness sectors. This program plays a crucial role in enhancing crop yields
and promoting food security.

[B.Sc. Plant Pathology]
B.Sc. Plant Pathology is a 3-year undergraduate program focused on the study of plant diseases and their
management. Students learn about pathogens, disease diagnosis, and sustainable control methods. Graduates
can work in agriculture, research, and crop protection industries. This program plays a vital role in
safeguarding plant health and ensuring food security.


[Mechanical Engineering]
Mechanical Engineering is one of the broadest and oldest branches of engineering, focused on the design,
development, and maintenance of mechanical systems. It integrates principles from physics, materials science,
thermodynamics, fluid mechanics, and structural analysis to create machines, tools, and systems that improve various
aspects of life and industries. Mechanical engineers work in fields ranging from aerospace and automotive to robotics,
energy systems, and manufacturing

[Civil Engineering]
Civil Engineering is one of the oldest and most broad branches of engineering, focusing on the design, construction,
and maintenance of infrastructure projects such as roads, bridges, dams, buildings, and water systems. Civil engineers
are responsible for ensuring that public and private infrastructure is safe, sustainable, and efficient, addressing both
environmental concerns and urbanization challenges.

[Electrical Engineering]
Electrical Engineering is a branch of engineering that deals with the study, design, and application of electrical
systems, devices, and technologies. It focuses on understanding and harnessing the principles of electricity,
electromagnetism, and electronics to create solutions for power generation, transmission, electrical circuits, and
electrical systems in various industries.

[Electronics and Communication Engineering]
Electronics and Communication Engineering (ECE) is a branch of engineering that integrates the principles of
electronics, communication systems, and signal processing. It focuses on designing, developing, and testing electronic
devices, circuits, and communication systems essential for a wide range of applications in telecommunications,
healthcare, automation, and consumer electronics.

[Computer Science and Engineering]
Computer Science and Engineering (CSE) is a discipline that integrates principles of computer science, engineering,
and mathematics to develop hardware and software systems. It focuses on the theoretical foundations of computing
along with practical applications to solve real-world problems.

[Artificial Intelligence and Machine Learning]
Artificial Intelligence and Machine Learning (AI & ML) Engineering focuses on creating intelligent systems that can
simulate human intelligence, learn from data, and perform tasks without explicit programming. This field combines
computer science, mathematics, and domain-specific knowledge to build innovative solutions for real-world problems.

[Data Science and Engineering]
Data Science and Engineering is an interdisciplinary field that combines statistical analysis, programming, and
machine learning to extract meaningful insights from large datasets. It focuses on the end-to-end lifecycle of data,
from data acquisition and storage to analysis, visualization, and application.

[Cybersecurity Engineering]
Cybersecurity Engineering focuses on designing, implementing, and managing secure systems to protect digital assets
and infrastructure from cyber threats. It combines computer science, network security, cryptography, and risk
management to safeguard information and systems

[Materials Science and Engineering]
Materials Science and Engineering (MSE) is an interdisciplinary field focused on understanding, designing, and
improving materials used in various industries. It combines physics, chemistry, engineering, and applied sciences to
develop materials that meet specific technological needs.

[Aviation Engineering]
Aviation Engineering is a specialized branch of engineering focused on the design, development, testing,
and maintenance of aircraft, drones, and related systems. It combines principles of aerospace engineering,
mechanical engineering, and electrical engineering to create safe and efficient aviation technologies.

[Marine Biotechnology Engineering]
Marine Biotechnology Engineering is a specialized field that applies engineering principles to marine biological
systems, focusing on the sustainable use of marine resources. This interdisciplinary field combines marine biology,
biotechnology, and engineering to address challenges in marine conservation, aquaculture, pharmaceuticals, and
biofuel development.

[Nuclear Engineering]
Nuclear Engineering is a specialized field focused on the principles and applications of nuclear reactions and
radiation processes. It plays a critical role in energy production, medical technologies, nuclear safety, and
environmental sustainability. This branch of engineering emphasizes the development, design, and
maintenance of nuclear systems, reactors, and safety protocols.

[ Information Technology]
Information Technology (IT) is a versatile and in-demand field focused on the use of computers and
software to store, retrieve, transmit, and manipulate data. It forms the backbone of modern businesses,
ensuring efficient communication, automation, and data management.

[Biotechnology]
Biotechnology Engineering is a multidisciplinary field that integrates biology, technology, and engineering
to develop innovative solutions in healthcare, agriculture, environmental management, and industrial
processes. It applies scientific principles to manipulate biological systems for the betterment of society.

[Biomedical Engineering]
Biomedical Engineering is an interdisciplinary field that applies engineering principles and design concepts
to healthcare and biology. The primary aim is to improve patient care, develop medical devices, and advance
diagnostics and therapeutic techniques.

[Chemical Engineering]
Chemical Engineering focuses on the design, development, and optimization of processes that convert raw
materials into valuable products, such as fuels, chemicals, medicines, and materials. It combines principles
of chemistry, physics, biology, and mathematics with engineering techniques to solve problems and develop
efficient systems.

[Aerospace Engineering]
Aerospace Engineering involves the design, development, testing, and maintenance of aircraft, spacecraft,
satellites, and missiles. It combines principles of physics, mathematics, and engineering to address
challenges in aviation and space exploration. This field is divided into two main branches: Aeronautical
Engineering (aircraft and atmospheric flight) and Astronautical Engineering (spacecraft and extraterrestrial
applications).

[Agricultural Engineering]
Agricultural Engineering integrates technology and engineering principles to improve agricultural
production, farm mechanization, soil management, water conservation, and environmental sustainability.
The discipline focuses on designing, developing, and maintaining systems and equipment that support
modern agriculture.

[Industrial Biotechnology]
Industrial Biotechnology applies biological systems and organisms to develop products and processes for
industrial applications. It bridges biology and engineering to produce biofuels, bioplastics, pharmaceuticals,
and other bioproducts, focusing on sustainability and reducing environmental impact.

[Systems Engineering]
Systems Engineering is an interdisciplinary field that focuses on designing, analyzing, and managing
complex systems and projects. It involves applying engineering principles to ensure the integration of
various components of a system to meet overall performance, safety, and operational objectives. Systems
engineers are involved in all stages of a systems lifecycle, from conceptual design to testing, operation, and
maintenance.

[Telecommunication Engineering]
Telecommunication Engineering focuses on the design, development, and maintenance of communication
systems and networks. This field involves understanding the transmission of data via electrical signals,
optical fibers, radio waves, and satellite communications, with applications in mobile networks, internet
infrastructure, and broadcasting systems.

[ Petrochemical Engineering]
Petrochemical Engineering is a specialized branch of chemical engineering that focuses on the extraction,
production, and processing of hydrocarbons into usable products such as plastics, synthetic materials, fuels,
and chemicals. This discipline integrates principles of chemistry, physics, and engineering to develop
sustainable methods for petrochemical production while minimizing environmental impact.

[Photonics Engineering]
Photonics Engineering is a specialized branch of engineering focusing on the generation, manipulation, and
application of light (photons) for various technological applications. It blends principles of physics, optics,
and engineering to develop cutting-edge solutions in telecommunications, medical devices, defense,
manufacturing, and more. This field is critical to advancing technologies such as fiber optics, lasers, and
imaging systems.

[Environmental Engineering]
Environmental Engineering focuses on applying scientific and engineering principles to improve the
environment, including air, water, and land resources. The field emphasizes the development of sustainable
solutions for pollution control, waste management, and resource conservation, aiming to protect public
health and ecosystems.

[Food Technology]
Food Technology is a multidisciplinary field that focuses on the processing, preservation, packaging,
quality control, and development of food products. It combines principles of chemistry, microbiology,
nutrition, and engineering to ensure food safety and innovation in the food industry.

[Marine Engineering]
Marine Engineering focuses on the design, development, operation, and maintenance of systems and
machinery used in ships, boats, and other marine vehicles. It involves the application of mechanical,
electrical, electronics, and civil engineering principles to ensure that maritime transportation and ocean
engineering technologies are effective and safe.

[Metallurgical Engineering]
Metallurgical Engineering is the branch of engineering that deals with the study of metals, their properties,
production, and refining. It combines principles from materials science, chemistry, and physics to
understand the behavior of metals and develop advanced processes for their extraction, purification, and
fabrication.

[Petroleum Engineering]
Petroleum Engineering is the branch of engineering that deals with the exploration, extraction, production,
and management of oil and gas reserves. It involves a combination of skills in geology, physics, chemistry,
and engineering principles to efficiently extract hydrocarbons from beneath the Earth’s surface. Petroleum
engineers work on drilling, reservoir management, production optimization, and the environmental impacts
associated with energy production.

[Automobile Engineering]
Automobile Engineering is a branch of engineering that focuses on the design, development, manufacture,
and maintenance of vehicles, including cars, trucks, motorcycles, and other transportation systems. It is an
interdisciplinary field that combines mechanical, electrical, software, and safety engineering to improve
vehicle performance, fuel efficiency, and safety.

[Robotics Engineering]
Robotics Engineering is an interdisciplinary branch of engineering that focuses on the design, construction,
operation, and application of robots. This field integrates mechanical, electrical, computer science, and
control systems to create robotic systems capable of performing tasks autonomously or semi-autonomously.
Robotics is a rapidly evolving field, with applications in industries such as manufacturing, healthcare,
defense, agriculture, and space exploration.

[Mechatronics Engineering]
Mechatronics Engineering is an interdisciplinary field that combines principles of mechanical engineering,
electronics, computer science, and control engineering to design and create intelligent systems and advanced
machinery. This field is integral to modern technological innovation and is widely applied in industries such
as automation, robotics, automotive, and aerospace.

[Nanotechnology Engineering]
Nanotechnology Engineering is a cutting-edge field that focuses on manipulating materials at the atomic and
molecular scale to create devices, systems, and processes with advanced functionalities. It integrates
principles from physics, chemistry, biology, and engineering to innovate across diverse sectors such as
healthcare, energy, electronics, and materials science.

[Textile Engineering]
Textile Engineering is a specialized field that involves the study of the principles and techniques used in
designing, producing, and improving textiles and related materials. This branch focuses on fibers, fabrics,
dyes, and production processes to develop high-quality and functional textile products for various
applications.

[Production and Industrial Engineering]
Production and Industrial Engineering is a multidisciplinary field that focuses on designing, optimizing, and
managing production systems and industrial operations. This branch combines engineering principles with
management techniques to enhance productivity, efficiency, and sustainability in manufacturing and service
industries.

[Mining Engineering]
Mining Engineering is a specialized branch of engineering that involves the exploration, extraction,
processing, and management of mineral resources from the earth. This field focuses on designing efficient
and sustainable methods for mining operations while considering environmental and safety concerns.

[Instrumentation Engineering]
Instrumentation Engineering is a specialized field of engineering that focuses on the design, development,
installation, and maintenance of instruments and systems used for measuring, monitoring, and controlling
physical quantities like pressure, temperature, flow, and level. Instrumentation engineers play a vital role in
automating processes across industries, ensuring efficient operation, safety, and product quality.

[Genetic Engineering]
Genetic Engineering is a branch of biotechnology focused on altering the genetic makeup of organisms
through various techniques like gene editing, cloning, and recombinant DNA technology. The goal is to
modify or create specific traits in organisms for various applications in medicine, agriculture, and industry.
Genetic engineers can work on improving crop yields, developing new medicines, and understanding
genetic diseases.

[Polymer Engineering]
Polymer Engineering is a specialized branch of engineering that focuses on the study, design, development,
and processing of polymers (plastics, rubber, fibers, and other materials made from synthetic or natural
polymers). Polymer engineers work with materials that have a wide range of applications across industries
such as automotive, healthcare, electronics, packaging, and construction. This field combines knowledge of
chemistry, material science, and manufacturing techniques to create high-performance, durable, and
sustainable polymer materials.

[Bioprocess Engineering]
Bioprocess Engineering is a specialized field of engineering that focuses on the design, optimization, and
operation of processes that use biological organisms, systems, or enzymes to produce products for various
industries. It combines principles of biology, chemistry, physics, and engineering to create processes for the
large-scale production of bio-based products such as pharmaceuticals, biofuels, food, and chemicals. This
field is essential for advancing industries that focus on sustainable practices and the production of bio-based
materials.

[Ceramic Engineering]
Ceramic Engineering is a branch of materials science and engineering that focuses on the design,
development, and processing of ceramic materials. Ceramic engineers work on a variety of materials such as
traditional ceramics (e.g., glass, tiles, bricks) and advanced ceramics (e.g., semiconductors, biomaterials,
piezoelectric materials). Ceramic materials are essential in numerous industries, from construction and
electronics to aerospace and medical devices.

[Software Engineering]
Software Engineering is a field that involves the systematic design, development, testing, and maintenance
of software applications. It focuses on creating high-quality software that meets user needs and is reliable,
scalable, and maintainable. Software engineers work in a variety of domains, from mobile app development
to enterprise-level software solutions, making it one of the most versatile and in-demand fields in
technology.

[Power Engineering]
Power Engineering is a specialized branch of engineering focused on the generation, transmission,
distribution, and utilization of electrical power. It involves the study of power systems, electrical machines,
energy conversion, and renewable energy technologies. Power engineers design and maintain systems that
supply electricity to homes, businesses, and industries, ensuring energy efficiency and sustainability.

[ Structural Engineering]
Structural Engineering is a specialized branch of civil engineering that focuses on the design, analysis, and
construction of structures such as buildings, bridges, dams, towers, and other infrastructures. Structural
engineers ensure that these structures are strong, stable, and capable of withstanding various loads and
environmental forces, while also being cost-effective and sustainable. This discipline requires in-depth
knowledge of materials, mechanics, and engineering principles to create safe and efficient structures.

[ Transportation Engineering]
Transportation Engineering is a branch of civil engineering focused on the planning, design, operation, and
management of transportation systems, such as highways, railways, airports, and public transit systems. It
aims to ensure the safe, efficient, and sustainable movement of people and goods. Transportation engineers
apply principles of engineering, economics, and logistics to design and maintain transportation infrastructure
that meets the growing demands of urbanization and globalization.

[Construction Engineering]
Construction Engineering is a branch of civil engineering that focuses on the planning, design, management,
and execution of construction projects, including buildings, roads, bridges, dams, and other infrastructure.
Construction engineers work with architects, contractors, and other engineers to ensure the safe, timely, and
cost-effective completion of construction projects. They apply engineering principles to manage
construction materials, labor, equipment, and technology to create structures that are durable, safe, and
efficient.

[Renewable Energy Engineering]
Renewable Energy Engineering is a field focused on the development and implementation of sustainable
energy solutions. It covers the study of renewable energy sources, such as solar, wind, biomass, hydro, and
geothermal energy, and how these sources can be used to generate power in an efficient, cost-effective, and
environmentally friendly manner. Renewable Energy Engineers work to design, improve, and manage
systems that harness energy from renewable resources to reduce dependence on fossil fuels and mitigate the
effects of climate change.

[Energy Engineering]
Energy Engineering is a multidisciplinary field that focuses on the efficient production, conversion, and
utilization of energy from both conventional and renewable sources. Energy engineers are involved in
designing and improving energy systems, with a strong emphasis on sustainability, efficiency, and reducing
environmental impact. They work on a variety of energy technologies, including fossil fuels, nuclear power,
renewable energy, and energy storage systems.

[B.Sc. Physics]
B.Sc. Physics is an undergraduate program that focuses on the principles and concepts of physics, covering
both theoretical and experimental aspects. This course lays the foundation for understanding natural
phenomena, analyzing physical systems, and exploring applications in various scientific and technological
fields.

[B.Sc. Chemistry]
B.Sc. Chemistry is an undergraduate program that focuses on the study of matter, its properties,
composition, and reactions. This course provides a solid foundation in chemical principles, laboratory
techniques, and their applications in various scientific and industrial fields.

[B.Sc. Mathematics]
B.Sc. Mathematics is an undergraduate program that focuses on the study of mathematical theories,
techniques, and applications. The course provides a deep understanding of algebra, calculus, geometry,
statistics, and mathematical modeling, preparing students for diverse career paths in science, technology,
and industry.

[B.Sc. Statistics]
B.Sc. Statistics is an undergraduate program that focuses on the collection, analysis, interpretation, and
presentation of data. The course equips students with statistical methods, tools, and computational
techniques to solve real-world problems in various domains like finance, healthcare, business, and research.

[ B.Sc. Applied Mathematics]
B.Sc. Applied Mathematics is an undergraduate program focused on using mathematical methods and
principles to solve real-world problems in science, engineering, technology, and industry. The course
emphasizes practical applications of mathematics in fields like physics, economics, computer science, and
data analytics, preparing students for diverse technical careers or advanced studies.

[B.Sc. Data Science]
B.Sc. Data Science is an undergraduate program focused on the methods, processes, and tools used to
analyze and interpret large and complex datasets. The course blends statistics, computer science, and domain
knowledge to extract meaningful insights, preparing students for data-driven decision-making roles across
various industries.

[B.Sc. Computer Science]
B.Sc. Computer Science is a three-year undergraduate program focusing on foundational and advanced
concepts of computing, programming, and information technology. The course equips students with the
skills needed to design and develop software, manage databases, and understand computer networks, making
it a cornerstone for careers in technology and software development.

[B.Sc. Forensic Science]
B.Sc. Forensic Science is a three-year undergraduate program that focuses on the application of scientific
principles and techniques to solve crimes and analyze evidence. The course covers a blend of biology,
chemistry, physics, and criminal justice, preparing students for careers in forensic laboratories, law
enforcement, and investigative agencies.

[ B.Sc. Electronics]
B.Sc. Electronics is a three-year undergraduate program that focuses on the principles and applications of
electronics, including circuit design, embedded systems, and communication technologies. It blends
theoretical knowledge with practical skills to prepare students for careers in technology, research, and
innovation.

[B.Sc. Geology]
B.Sc. Geology is a three-year undergraduate program focused on the study of Earth's structure, processes,
materials, and history. It involves the exploration of rocks, minerals, fossils, and natural phenomena like
earthquakes, volcanoes, and plate tectonics. The course combines theoretical knowledge with practical
fieldwork to understand Earth's dynamics and resource management.

[B.Sc. Applied Physics]
B.Sc. Applied Physics is an undergraduate program focused on the practical applications of physics in
various industries and technological advancements. It combines core physics principles with modern
technological solutions in fields like electronics, telecommunications, nanotechnology, materials science,
and instrumentation. The course is designed to equip students with both theoretical knowledge and hands-on
experience to solve real-world problems using the concepts of physics.

[Integrated M.Sc]
An Integrated M.Sc. program is a five-year undergraduate-to-postgraduate degree course that allows
students to earn both their Bachelor's and Master's degrees in a specific field of science in one continuous
program. The course typically combines the study of foundational subjects in science along with advanced
topics, making it an attractive option for students who are sure about pursuing a scientific career or research
in their chosen domain.

[Bachelor of Business Administration(BBA)]
Bachelor of Business Administration (BBA) is a popular undergraduate degree designed for students who
want to pursue careers in management, business, and entrepreneurship. It provides foundational knowledge
and skills in business operations, management principles, and decision-making processes.

[Bachelor of Commerce(B.Com)]
Bachelor of Commerce (B.Com) is an undergraduate degree designed for students interested in the fields of
commerce, finance, economics, accounting, and business. The program offers a comprehensive
understanding of business operations, financial management, accounting practices, and economics.

[Bachelor of Management Studies(BMS)]
Bachelor of Management Studies (BMS) is an undergraduate program designed for students who wish to
pursue a career in management, business operations, and leadership roles. The program provides a strong
foundation in various aspects of business management, organizational behavior, finance, marketing, human
resources, and entrepreneurship.

[Bachelor of Management Studies(BBS)]
Bachelor of Management Studies (BBS) is an undergraduate program designed to provide students with
essential skills in management, business strategies, and operations. The program focuses on building a
strong foundation in management principles, enhancing leadership qualities, and preparing students for
careers in diverse sectors such as marketing, finance, human resources, and entrepreneurship.

[Bachelor of Computer Applications(BCA)]
Bachelor of Computer Applications (BCA) is a three-year undergraduate program that focuses on the study
of computer applications, software development, and programming. The course provides students with both
theoretical and practical knowledge of computer science, preparing them for a career in IT, software
development, and technology management.

[B.Sc. Computer Science]
B.Sc. Computer Science is a three-year undergraduate program that provides students with a strong
foundation in computer science, programming, and IT applications. The course focuses on computer
systems, software development, networking, and data management. It also covers theoretical concepts in
mathematics and computer science to enhance problem-solving and analytical skills.

[B.Sc. in Information Technology]
B.Sc. in Information Technology (IT) is a three-year undergraduate degree that focuses on the study of
computers, networks, software development, data management, and information systems. The program
combines theoretical knowledge and practical skills to equip students with a deep understanding of how
information technology is applied in various industries. Students will also learn about the latest
technological tools and trends, making them well-prepared for careers in IT and related fields.

[B.Sc. in Data Science and Big Data]
B.Sc. in Data Science and Big Data is an undergraduate program designed to provide students with a
comprehensive understanding of data analysis, machine learning, statistical techniques, and handling large
datasets using advanced tools. The course blends theoretical knowledge with practical skills to work with
vast amounts of data and extract meaningful insights that drive decisions in various industries.

[B.Sc. in Artificial Intelligence and Machine Learning]
B.Sc. in Artificial Intelligence (AI) and Machine Learning (ML) is an undergraduate program that focuses
on imparting foundational knowledge and skills in AI, machine learning, data science, and advanced
computing. This program combines computer science with the latest advancements in AI and ML to create
intelligent systems and automate processes using algorithms and data. Students learn to design, develop, and
apply AI models to solve real-world problems.

[B.Sc. in Cybersecurity]
B.Sc. in Cybersecurity is an undergraduate program focused on protecting computer systems, networks, and
data from cyber threats and attacks. The course covers various aspects of information security, encryption,
ethical hacking, network security, and risk management to ensure the confidentiality, integrity, and
availability of digital assets. With the increasing reliance on digital infrastructure and data, cybersecurity
professionals are in high demand to defend against cybercrimes.

[Bachelor of Architecture(B.Arch)]
Bachelor of Architecture (B.Arch) is a professional undergraduate degree program that prepares students to
become architects. The program blends technical knowledge with artistic skills, focusing on the design,
planning, and construction of buildings and structures. It involves the study of architectural theory, building
design, urban planning, construction management, and the integration of sustainable practices into the built
environment.

[ Bachelor of Design(B.Des)]
Bachelor of Design (B.Des) is an undergraduate program focused on design principles and practices across
various domains such as product design, fashion design, graphic design, industrial design, and more. It
provides students with both the creative skills and technical knowledge required to solve complex problems
through design. The course prepares students to think innovatively, with an emphasis on understanding user
needs, sustainability, and aesthetics.

[Bachelor of Planning(B.Plan)]
Bachelor of Planning (B.Plan) is an undergraduate course that focuses on urban planning and development.
It equips students with the knowledge and skills required to design, develop, and manage urban spaces and
infrastructure. The course combines elements of architecture, sociology, economics, and environmental
studies to prepare students for the challenges of creating sustainable and efficient urban environments.

[Bachelor of Fine Arts (BFA)]
Bachelor of Fine Arts (BFA) is an undergraduate program focused on developing the artistic skills of
students in various visual art forms. The course nurtures creativity and helps students to build expertise in
fields like painting, sculpture, printmaking, graphic design, photography, and digital art. The program allows
students to explore traditional and modern techniques and encourages them to develop their personal artistic
styles.

[Bachelor of Visual Arts (BVA)]
The Bachelor of Visual Arts (BVA) is an undergraduate degree program that focuses on the study and
practice of visual arts, including painting, sculpture, printmaking, photography, digital media, and more. It is
designed for students who are passionate about artistic expression and want to develop their skills in various
forms of visual art. BVA provides a comprehensive understanding of art techniques, history, theory, and
contemporary practices.

[BA Psychlogy]
Bachelor of Arts (BA) in Psychology is an undergraduate program that focuses on the scientific study of the
human mind, behavior, and mental processes. The course delves into understanding individuals thoughts,
emotions, actions, and social interactions. Students gain knowledge of various psychological theories,
research methods, and practical applications in different fields such as health, education, and social services.

[BA Sociology]
Bachelor of Arts (BA) in Sociology is an undergraduate program that focuses on the study of society, social
behavior, and the structures and dynamics of human relationships. It explores various social institutions,
cultures, social issues, and the impact of social forces on individuals and groups. Sociology seeks to
understand human social behavior through empirical research, theoretical frameworks, and qualitative and
quantitative methods.

[BA Economics]
A BA in Economics is an undergraduate program that provides students with a comprehensive
understanding of economic principles, theories, and practices. The course covers both microeconomics and
macroeconomics and explores the impact of economic activities on individuals, industries, and nations. It
equips students with analytical and quantitative skills to interpret economic data, evaluate policies, and make
informed decisions.

[BA Anthropology]
A BA in Anthropology is an undergraduate program that delves into the study of human societies, cultures,
behaviors, and evolution. Anthropology combines aspects of social science, biology, history, and
archaeology to provide a comprehensive understanding of human diversity, development, and the various
ways humans interact with their environment. The program prepares students to analyze and understand
human experiences from a cross-cultural perspective, making it suitable for careers in research, education,
social work, and international development.

[BA Geography]
A BA in Geography is an undergraduate program that focuses on the physical environment, human
activities, and the relationship between the two. It combines elements of physical geography (such as
landforms, climate, and ecosystems) and human geography (such as urbanization, migration, and economic
activities). The program equips students with a comprehensive understanding of the Earths landscapes,
human-environment interactions, and spatial patterns, making it relevant for careers in environmental
management, urban planning, research, and development.

[BA Philosophy]
A BA in Philosophy is an undergraduate program that focuses on the study of fundamental questions about
existence, knowledge, ethics, logic, and the nature of reality. It involves exploring ancient and modern
philosophical thought, as well as examining the logical reasoning behind concepts and ideas. Students
develop critical thinking skills, logical analysis, and an understanding of how human beings interpret the
world around them. Philosophy encourages students to question, analyze, and reflect on life’s most profound
topics.

[BA History]
A BA in History is an undergraduate program that explores the past through critical analysis of historical
events, figures, and cultures. This program helps students understand the complexities of history, the
evolution of societies, and the factors that have shaped the world today. By studying history, students
develop research, writing, and analytical skills that are transferable to various careers.

[BA Political Science]
A BA in Political Science is an undergraduate program that focuses on the study of politics, government
systems, political behavior, public policies, international relations, and ideologies. The course aims to equip
students with an understanding of political structures, theories, and the processes that govern society. It
fosters critical thinking, analytical skills, and a deeper understanding of the political world, preparing
students for a variety of careers in politics, government, research, and public service.

[BA Public Administration]
BA in Public Administration is an undergraduate program that focuses on the management and
administration of public policies, government operations, and public sector organizations. It provides
students with an understanding of governance, public service, administrative law, and the implementation of
policies. The course is designed to develop the skills needed for effective administration in the public sector,
preparing students for careers in government, NGOs, and related fields.

[Bachelor of Law(LLB)]
The Bachelor of Law (LLB) is a professional undergraduate law degree program that is designed to provide
students with a comprehensive understanding of legal principles, systems, and processes. It prepares
students for careers in the legal field, whether as advocates, corporate lawyers, legal advisors, or public
servants. The course covers various branches of law and develops analytical, logical, and critical thinking
skills necessary to practice law.

[BA LLB,BBA LLB,B.Com.LLB,B.Sc.LLB(Integrated)]
These integrated law programs combine undergraduate education with a law degree (LLB). They are
designed to provide students with a strong foundation in both their chosen field (like Arts, Business,
Commerce, or Science) and legal education, equipping them with the skills required for a legal career.

[Bachelor of Education (B.Ed)]
The Bachelor of Education (B.Ed) is a professional undergraduate program designed to prepare individuals
for a career in teaching. The program equips students with the necessary skills and knowledge to become
effective educators in schools at various levels, from primary to secondary education. B.Ed focuses on
pedagogical theory, teaching methodologies, and practical training in classroom management.

[Bachelor of Physical Education (B.P.Ed)]
The Bachelor of Physical Education (B.P.Ed) is an undergraduate degree program that focuses on physical
education, fitness, sports science, and wellness. It is designed for individuals who wish to pursue a career in
teaching physical education in schools, fitness training, or sports coaching. The course combines theoretical
knowledge of health and fitness with practical training in various sports and physical activities.

[B.Sc in Physical Education,Health Education and Sports Sciences]
The B.Sc in Physical Education, Health Education, and Sports Sciences is a specialized undergraduate
program focused on the study of physical fitness, health education, and sports sciences. This course is ideal
for individuals passionate about sports, physical fitness, health promotion, and wellness. It offers in-depth
knowledge about exercise physiology, sports management, health science, and athletic development,
preparing students for careers in teaching, coaching, fitness training, and sports management.

[ B.Sc.Aviation]
The B.Sc. in Aviation is a specialized undergraduate program designed for individuals interested in pursuing
careers in aviation and related fields. The course provides comprehensive knowledge about aviation
management, aerodynamics, aircraft systems, and flight operations, equipping students with the skills
required to work in various roles within the aviation industry, including piloting, aviation safety, air traffic
control, airport management, and more.

[Commercial Pilot License (CPL)]
The Commercial Pilot License (CPL) is a certification required for individuals who wish to work as
commercial pilots, flying aircraft for airlines, cargo companies, or as private charter pilots. This license is
the first step to becoming a professional pilot and provides the necessary training and qualifications to
operate commercial aircraft safely and efficiently.

[Aircraft Maintenance Engineering (AME)]
Aircraft Maintenance Engineering (AME) is a specialized technical program that trains students to inspect,
maintain, and repair aircraft to ensure their safety and airworthiness. Unlike traditional degree programs,
AME is a licensed-based course regulated by aviation authorities such as the DGCA (Directorate General of
Civil Aviation) in India.

[Bachelor of Hotel Management(BHM)]
Bachelor of Hotel Management (BHM) is an undergraduate degree program focused on preparing students
for careers in the hospitality and service industry. The course provides theoretical knowledge and practical
training in hotel operations, food and beverage services, housekeeping, front office, and event management.

[B.Sc in Hospitality and Hotel Administration]
B.Sc. in Hospitality and Hotel Administration (B.Sc. HHA) is a professional undergraduate program
designed to equip students with comprehensive knowledge and practical skills for the hospitality and service
industry. The course blends theoretical knowledge with practical exposure to prepare graduates for various
roles in hotel management, catering, travel, and event industries.

[Bachelor of catering and Culinary Arts (BCTCA)]
Bachelor of Catering and Culinary Arts (BCTCA) is an undergraduate program designed for individuals
passionate about cooking, hospitality, and culinary innovation. The course emphasizes hands-on training in
culinary techniques, food presentation, and catering management, preparing students for dynamic careers in
the food service and hospitality industries.

[Materials Science and Engineering]
Materials Science and Engineering (MSE) is an interdisciplinary field focused on understanding, designing, and
improving materials used in various industries. It combines physics, chemistry, engineering, and applied sciences to
develop materials that meet specific technological needs.

[Photonics Engineering]
Photonics Engineering focuses on the science and technology of generating, controlling, and detecting
photons (light particles). It is an interdisciplinary field that combines optics, electronics, and material
science to develop innovative applications in areas such as communication, imaging, healthcare, and
manufacturing.

[B.Sc. Animation and Multimedia]
B.Sc. Animation and Multimedia is a specialized undergraduate program that focuses on the creative and
technical aspects of animation, visual effects (VFX), and multimedia design. The course blends artistic skills
with digital technologies to prepare students for the entertainment, gaming, advertising, and media
industries.

[B.Sc. Software Development]
B.Sc. in Software Development is an undergraduate program focused on equipping students with technical
and practical knowledge of software design, development, testing, and deployment. The course prepares
individuals for careers in programming, software engineering, and application development by blending
foundational computer science principles with hands-on coding and project management experience.

[COMMERCE]
PUC Commerce in Karnataka offers a foundational course for students interested in business, economics,
and management. It prepares students for careers in finance, accounting, management, and entrepreneurship.
The curriculum combines theoretical knowledge and practical applications to build a strong understanding
of commerce and related fields.

[CEBA]
CEBA (Computer Science, Economics, Business Studies, Accountancy)
 A versatile choice, this combination is ideal for students interested in commerce with a strong
emphasis on technology and economic analysis.

[ABMS]
ABMS (Accountancy, Business Studies, Mathematics, Statistics)
 Perfect for students aiming for careers in finance, data analysis, and professional courses like CA,
CS, or actuarial science.

[MEBA]
 MEBA (Mathematics, Economics, Business Studies, Accountancy)
 Popular among students interested in pursuing higher studies or careers in economics, business
management, and quantitative analysis.

[ABSCs]
ABSCs (Accountancy, Business Studies, Statistics, Computer Science)
 Suitable for students focusing on commerce with computational and statistical applications,
preparing for roles in business analytics or IT sectors.

[SEBA]
SEBA (Statistics, Economics, Business Studies, Accountancy)
 A classic commerce combination for students interested in economics, business studies, and
statistical applications, leading to careers in data science, business research, and finance.

[Bachelor of Commerce (B.Com)]
The Bachelor of Commerce (B.Com) is an undergraduate program focused on the fundamentals of
commerce, finance, accounting, economics, and business management. It provides a strong foundation for
pursuing careers in various financial, business, and administrative fields.

[Bachelor of Business Administration (BBA)]
The Bachelor of Business Administration (BBA) is a professional undergraduate course focused on
developing managerial, business, and leadership skills. It covers foundational knowledge in various aspects
of business management, preparing students for roles in diverse industries or further studies in business and
management.

[ Bachelor of Management Studies (BMS)]
The Bachelor of Management Studies (BMS) is a comprehensive undergraduate program that prepares
students for careers in management, offering a blend of theoretical knowledge and practical skills in
business management. The course emphasizes managerial concepts, decision-making, leadership, and
organizational behavior, making it ideal for individuals seeking to pursue careers in business or management
fields.

[Bachelor of Business Management (BBM)]
The Bachelor of Business Management (BBM) is a professional undergraduate course focused on
developing business and management skills. The program provides a strong foundation in business
principles, with an emphasis on leadership, entrepreneurship, and management functions across various
business domains. It is designed to prepare students for leadership positions in the business world.

[Bachelor of Business Studies (BBS)]
The Bachelor of Business Studies (BBS) is an undergraduate program designed to provide students with a
deep understanding of business operations, strategies, and management. It focuses on developing practical
skills needed to manage organizations efficiently while introducing key business concepts. The course
prepares students for leadership roles and equips them with the knowledge required for diverse business
functions.

[Bachelor in International Business and Finance (BIBF)]
The Bachelor in International Business and Finance (BIBF) is an undergraduate program designed to
provide students with an in-depth understanding of global business practices, financial management, and the
operations of international markets. The course combines theoretical knowledge with practical skills,
preparing students for roles in multinational corporations, financial institutions, and global trade.

[Bachelor of Hotel Management (BHM)]
The Bachelor of Hotel Management (BHM) is a professional undergraduate course that focuses on
hospitality, hotel administration, and catering management. It equips students with the skills and knowledge
needed to manage hotels, resorts, and other hospitality sectors, emphasizing customer service, operations,
and business management.

[Bachelor of Hotel Management and Catering Technology (BHMCT)]
The Bachelor of Hotel Management and Catering Technology (BHMCT) is an undergraduate
professional degree focused on the hospitality and catering sectors. It emphasizes both theoretical and
practical training in hotel management, culinary arts, and service operations. This course prepares students
for leadership roles in hotels, restaurants, airlines, cruise lines, and other hospitality-related industries.

[Chartered Accountancy (CA)]
Chartered Accountancy (CA) is a professional certification course that trains students in financial
management, auditing, taxation, and accounting principles. Regarded as one of the most prestigious
qualifications in the finance domain, it equips individuals to manage complex financial systems, conduct
audits, and provide advisory services. The course is governed by professional bodies like the Institute of
Chartered Accountants of India (ICAI).

[Company Secretary (CS)]
Company Secretary (CS) is a professional course offered by the Institute of Company Secretaries of
India (ICSI). It focuses on corporate governance, company law, and compliance management, equipping
candidates to handle the legal and regulatory requirements of companies. Company Secretaries play a vital
role in ensuring that businesses comply with laws, manage board meetings, and maintain transparent
governance practices.

[Cost and Management Accountancy (CMA)]
Cost and Management Accountancy (CMA) is a professional certification offered by the Institute of Cost
Accountants of India (ICAI). It focuses on cost management, financial planning, and strategic decisionmaking. CMAs are instrumental in analyzing financial data to enhance the efficiency and profitability of
organizations.

[Certified Financial Planner (CFP)]
The Certified Financial Planner (CFP) certification is a globally recognized professional credential for
individuals aspiring to build a career in financial planning and wealth management. Offered by the
Financial Planning Standards Board (FPSB), it equips candidates with in-depth knowledge of financial
strategies, investment planning, and risk management to provide sound financial advice to individuals and
businesses.

[ Chartered Financial Analyst (CFA)]
The Chartered Financial Analyst (CFA) program, offered by the CFA Institute, is one of the most
prestigious certifications in the field of investment management and financial analysis. It is designed to
equip candidates with in-depth knowledge of investment strategies, asset management, and financial
markets.

[Financial Risk Manager (FRM)]
The Financial Risk Manager (FRM) is a globally recognized professional certification offered by the
Global Association of Risk Professionals (GARP). It is designed to develop expertise in identifying,
analyzing, and mitigating financial risks, and it is highly sought after in the banking, finance, and investment
industries.

[Association of Chartered Certified Accountants (ACCA)]
The Association of Chartered Certified Accountants (ACCA) is a globally recognized professional
qualification in accounting and finance. It prepares candidates with skills in financial management, auditing,
taxation, and accounting, enabling them to work in diverse industries across the world.

[Certified Public Accountant (CPA)]
The Certified Public Accountant (CPA) qualification is a globally recognized professional certification for
accountants. It is administered by the American Institute of Certified Public Accountants (AICPA) and
validates expertise in accounting, auditing, taxation, and financial management. It is particularly valuable for
those pursuing careers in the United States or multinational corporations.

[ Diploma in Banking and Finance (DBF)]
The Diploma in Banking and Finance (DBF) is a specialized course designed to provide a solid foundation
in the banking and financial sectors. It covers various aspects of the banking industry, financial products,
and services, helping students develop practical skills for working in financial institutions, banks, and
financial service companies.

[ Insurance Institute of India (III)]
The Insurance Institute of India (III) is a professional body that offers various certifications and
qualifications for individuals pursuing a career in the insurance sector. The institute aims to promote
education and development in the insurance industry by offering a wide range of courses that enhance
knowledge and skills related to insurance and risk management.

[Certified Investment Banker]
The Certified Investment Banker (CIB) is a professional certification program designed to provide
individuals with the specialized knowledge and skills required to excel in the field of investment banking. It
focuses on the principles and practices of investment banking, corporate finance, financial markets, and
financial instruments. The certification is highly regarded in the finance industry and is ideal for those
looking to pursue a career in investment banking, mergers and acquisitions (M&A), corporate restructuring,
and capital markets.

[BA Economics]
The Bachelor of Arts in Economics (BA Economics) is an undergraduate program focusing on economic
theories, policies, and practices. It equips students with the analytical and problem-solving skills necessary
for understanding and addressing economic challenges at individual, national, and global levels.

[B.Sc. Economics]
The Bachelor of Science in Economics (B.Sc. Economics) is an undergraduate program emphasizing
quantitative and analytical skills to study economic systems and their applications. It integrates economics
with mathematics, statistics, and data analysis to provide a comprehensive understanding of economic
principles and their practical implications.

[BA Business Economics]
The Bachelor of Arts in Business Economics (BA Business Economics) is an undergraduate program that
blends economic theories with business practices. It equips students with analytical and strategic decisionmaking skills applicable to real-world business challenges. The program focuses on understanding economic
systems, market behavior, and the business environment.

[Bachelor in Quantitative Economics]
The Bachelor in Quantitative Economics is an undergraduate program that combines the study of
economics with advanced quantitative techniques such as mathematics, statistics, and econometrics. It is
designed to equip students with analytical and computational skills to address real-world economic problems
and policy-making challenges.

[B.Com in Business Economics]
B.Com in Business Economics is an undergraduate commerce program that integrates core concepts of
commerce with the study of economic theories and their application to business. It focuses on enhancing
students analytical, decision-making, and problem-solving skills in business contexts using economic
principles.

[B.Sc. Applied Statistics]
B.Sc. Applied Statistics is an undergraduate program designed to focus on the practical application of
statistical methods in real-world scenarios. The course emphasizes data analysis, problem-solving, and
statistical computing to address challenges in industries such as business, healthcare, economics, and
technology.

[Bachelor of Statistics(B.Stat)]
Bachelor of Statistics (B.Stat) is an undergraduate program that provides a rigorous foundation in
theoretical and applied statistics. It is designed for students with a strong aptitude for mathematics and data
analysis, preparing them for careers in research, analytics, and advanced studies in statistics and related
fields.

[B.Com. LLB]
B.Com. LLB is an integrated dual-degree program combining commerce and law. It prepares students for
legal practice with a strong foundation in business, accounting, taxation, and corporate law. This course is
ideal for individuals interested in legal careers within the corporate and commercial sectors.

[BBA LLB]
[BBA LLB is an integrated 5-year professional degree that combines business administration with legal
education. This course is ideal for students interested in pursuing careers in corporate law, business
consulting, and management roles with a legal foundation.]

[BA LLB]
BA LLB is a 5-year integrated undergraduate program that combines a foundation in arts with a
comprehensive legal education. It is designed for students interested in exploring a legal career while
gaining insights into social sciences, which helps in understanding the societal context of laws.

[Bachelor of Finance and Investment Analysis (BFIA)]
BFIA is a specialized undergraduate program focused on financial management, investment strategies, and
analytical skills. It prepares students for careers in finance, banking, investment, and portfolio management.
This course combines theoretical knowledge with practical exposure to financial markets.

[ B.Com. in Financial Markets]
B.Com. in Financial Markets is an undergraduate program focusing on the principles, practices, and
operations of financial markets. The course equips students with skills and knowledge related to investment,
risk management, financial instruments, and market analysis.

[B.Com. in Financial Management]
B.Com. in Financial Management is an undergraduate program focusing on the principles and practices of
managing finances in organizations. It combines financial theories with practical skills to prepare students
for roles in financial planning, analysis, and management.

[Bachelor of Banking and Insurance (BBI)]
BBI is an undergraduate program that combines banking, insurance, and financial concepts to prepare
students for careers in the financial services industry. The course focuses on developing skills in banking
operations, risk management, and insurance policies, equipping students to meet industry demands.

[B.Com. in Banking and Finance]
B.Com. in Banking and Finance is an undergraduate degree focusing on the fundamentals of banking
systems, financial management, investment strategies, and economic policies. This course equips students
with analytical and managerial skills for careers in the banking and finance sectors.

[B.Sc. in Finance]
B.Sc. in Finance is an undergraduate program that focuses on the principles of financial management,
investment strategies, corporate finance, and financial analysis. It aims to equip students with strong
analytical, quantitative, and decision-making skills in finance.

[Bachelor in Financial and Investment Planning]
Bachelor in Financial and Investment Planning is an undergraduate program designed to provide
comprehensive knowledge and skills in personal finance, wealth management, investment strategies, and
financial planning. It prepares students for careers in financial advisory, investment consulting, and portfolio
management.

[BBA in Finance and Banking]
BBA in Finance and Banking is a three-year undergraduate program focused on building foundational
knowledge and skills in banking, financial services, and investment management. It equips students with the
expertise to manage financial assets, analyze markets, and understand banking operations.

[BBA in Financial Services]
BBA in Financial Services is a specialized three-year undergraduate program that focuses on financial
markets, investment strategies, wealth management, and banking services. It equips students with the
technical and managerial skills required to excel in the dynamic financial sector.

[Bachelor of Tourism and Travel Management]
The Bachelor of Tourism and Travel Management (BTTM) is an undergraduate program designed to
equip students with the knowledge and skills required for careers in the tourism, travel, and hospitality
industries. The course combines theoretical learning with practical training to prepare students for roles in
tourism operations, travel agencies, event management, and more.

[Information Technology (B.Sc. IT )]
The B.Sc. IT program is a three-year undergraduate degree focused on developing technical and managerial
skills in the field of Information Technology. The course emphasizes computer systems, software
applications, networking, and database management, preparing students for roles in the IT and technology
sectors.

[Bachelor of Mass Media (BMM)]
Bachelor of Mass Media (BMM) is a 3-year undergraduate program that focuses on media and
communication, preparing students for careers in various mass media fields such as journalism, public
relations, advertising, filmmaking, radio, television, and digital media. This course provides both theoretical
knowledge and practical skills, equipping students with the ability to analyze, create, and deliver content
across different media platforms.

[Bachelor of Event Management]
Bachelor of Event Management (BEM) is a specialized undergraduate program designed to prepare
students for careers in the event planning and management industry. This course focuses on teaching the key
skills needed to organize, plan, and execute various events, from corporate events to weddings, concerts,
conferences, and festivals. It covers event logistics, marketing, finance, and project management, providing
students with both theoretical and practical knowledge necessary for managing events efficiently.

[Bachelor of Business Studies (BBS)]
The Bachelor of Business Studies (BBS) is an undergraduate program designed to provide students with a
deep understanding of business operations, strategies, and management. It focuses on developing practical
skills needed to manage organizations efficiently while introducing key business concepts. The course
prepares students for leadership roles and equips them with the knowledge required for diverse business
functions.

[ARTS]
PUC Arts is a diverse stream that focuses on humanities, social sciences, and languages, providing a
foundation for creative, analytical, and critical thinking skills. It prepares students for careers in fields like
education, law, journalism, public administration, and social work. The stream emphasizes understanding
human behavior, society, culture, and history. It is ideal for students interested in shaping societal
frameworks and exploring intellectual pursuits

[HEPS]
HEPS (History, Economics, Political Science, Sociology)
o A well-rounded combination that explores historical, economic, and political perspectives alongside
social structures

[HEPPSy]
HEPPSy (History, Economics, Political Science, Psychology)
o Combines historical context, economic trends, political systems, and human behavior to provide a
comprehensive understanding of societal structures and governance.

[HEG]
HEG (History, Economics, Geography)
o Focuses on historical events, economic policies, and geographic studies, ideal for students interested
in civil services or geography-related careers.

[HEK]
HEK (History, Economics, Kannada)
o Combines historical and economic analysis with an emphasis on regional language studies.

[HSK]
HSK (History, Sociology, Kannada)
o Combines sociological theories and Kannada literature with historical studies.

[SHPS]
SHPS (Sociology, History, Political Science, Psychology)
o Explores human behavior, social structures, and political systems alongside historical developments.

[HESPsy]
HESPsy (History, Economics, Sociology, Psychology)
o Merges insights into human behavior, societal dynamics, and economic trends with historical
context.

[GEPSy]
GEPSy (Geography, Economics, Political Science, Psychology)
o A blend of geographic, economic, political, and psychological studies, fostering analytical and
observational skills.

[HEP]
HEP (History, Economics, Political Science)
o Ideal for students aspiring for careers in public administration, law, or political analysis.
HEPS is a pre-university course designed for students interested in exploring the foundations of society, politics, and
economics. It provides a multidisciplinary understanding of historical events, economic systems, governance
structures, and social dynamics. This combination lays a strong foundation for careers in social sciences, civil
services, law, journalism, and public administration. Perfect for those passionate about understanding and influencing
societal change!

[Bachelor of Arts (BA)]
The Bachelor of Arts (BA) is a versatile undergraduate program pursued after 12th grade, offering specialization in
fields like humanities, social sciences, and languages. Spanning 3 years, it develops critical thinking, communication,
and analytical skills, preparing students for diverse careers or further studies. With a broad range of subjects, the BA
program fosters creativity and a deep understanding of culture, society, and history.

[Bachelor of Social Work(BSW) ]
The Bachelor of Social Work (BSW) is an undergraduate program designed to prepare students for a rewarding
career in social services and community development. This course focuses on understanding social issues, human
behavior, and welfare policies while developing skills to support individuals, families, and communities. With a
strong emphasis on fieldwork and practical training, it equips students to address societal challenges and promote
social justice.

[BA Journalism]
The Bachelor of Arts in Journalism is a comprehensive undergraduate program that introduces students to
the dynamic world of media and communication. It focuses on developing skills in reporting, writing,
editing, and multimedia storytelling, preparing students for careers in print, broadcast, and digital media.
This 3-year course nurtures critical thinking, ethical journalism, and the ability to deliver impactful news
and stories to a global audience.

[BA in Communication and Media]
The BA in Communication and Media is a dynamic undergraduate program that introduces students to the world of
media, journalism, and communication. This course covers a wide range of subjects including media writing, digital
media, public relations, and broadcasting, equipping students with the skills to excel in the fast-paced media industry.
It offers a blend of theoretical knowledge and practical experience, preparing graduates for various roles in media
organizations, advertising, and corporate communications.

[BA in Film and Television Studies]
BA in Film and Television Studies is an undergraduate program that explores the history, theory, and practical
aspects of film and television production. Students learn about film direction, scriptwriting, cinematography, editing,
and media analysis. The course also covers the cultural impact of films and television on society. It offers a creative
and analytical foundation for those interested in the entertainment industry, preparing graduates for careers in
filmmaking, television production, and media management.

[B.Sc. in Visual Communication]
B.Sc. in Visual Communication is a creative undergraduate course that focuses on using visual media to
communicate messages effectively. It covers topics such as graphic design, photography, animation, advertising, and
multimedia production. This course helps students develop skills in visual storytelling and design, preparing them for
careers in media, advertising, entertainment, and digital arts. Ideal for those with a passion for creativity and
technology, B.Sc. in Visual Communication opens up diverse opportunities in the visual arts and media industry.

[Bachelor of Mass Communication]
The Bachelor of Mass Communication is a dynamic 3-year undergraduate course that focuses on the principles and
practices of media and communication. It covers areas like journalism, broadcasting, public relations, advertising, and
digital media. Students gain essential skills in storytelling, content creation, and media analysis, preparing them for
diverse careers in the media industry. This course is ideal for those passionate about the power of communication and
seeking to make an impact in the world of media.

[Bachelor of Journalism and Mass Communication (BJMC)]
Bachelor of Journalism and Mass Communication (BJMC) is a 3-year undergraduate course that focuses on
developing skills in media, communication, and journalism. It covers subjects like print media, broadcasting, digital
media, advertising, and public relations. Students learn to analyze and create content, work with various media
platforms, and understand the role of media in society. The course prepares students for dynamic careers in media,
news, and communications, equipping them with the practical skills required in the fast-evolving media industry.

[BA in Multimedia and Mass Communication]
BA in Multimedia and Mass Communication is a 3-year undergraduate course that combines creativity with
communication skills. The program covers multimedia production, digital media, film studies, advertising, public
relations, and journalism. Students gain hands-on experience in content creation, video editing, graphic design, and
digital marketing. This course prepares graduates for diverse careers in media, entertainment, advertising, and digital
platforms, offering a strong foundation for success in the evolving media industry.

[BA in Digital Media]
BA in Digital Media is a 3-year undergraduate course designed for students interested in the evolving world of online
content creation, digital marketing, and multimedia communication. The course covers key areas such as social media,
digital video production, web design, and digital advertising. It equips students with the skills needed to create,
manage, and promote content across various digital platforms. This program opens up diverse career opportunities in
the fast-growing digital media industry.

[BA in Advertising and Public Relations]
BA in Advertising and Public Relations is a 3-year undergraduate course designed to provide students with a deep
understanding of advertising, branding, and media strategies. The course covers subjects like marketing
communication, public relations, media planning, consumer behavior, and digital marketing. Students gain hands-on
experience in creating campaigns, managing media relations, and analyzing consumer behavior. This program
prepares students for rewarding careers in advertising agencies, PR firms, corporate communication, and media
companies.

[Bachelor of Retail Management]
Bachelor of Retail Management is a 3-year undergraduate course designed to equip students with the skills needed
to manage and operate retail businesses. It covers key areas like retail marketing, supply chain management,
merchandising, consumer behavior, and sales strategies. The course provides practical knowledge of the retail
industry, preparing students for leadership roles in retail operations, e-commerce, and brand management. Graduates
can pursue rewarding careers in retail, logistics, and sales management.

[Bachelor of Business Economics (BBE)]
Bachelor of Business Economics (BBE) is a 3-year undergraduate course that combines economics with business
management principles. It focuses on understanding economic theories, market behavior, financial systems, and
business strategies. The course equips students with analytical and problem-solving skills essential for business
decision-making. Graduates can pursue careers in finance, marketing, consulting, and economics, making it an ideal
choice for those interested in both economics and business management.

[Bachelor in International Business and Finance(BIBF)]
Bachelor in International Business and Finance (BIBF) is a 3-year undergraduate course designed to provide
students with knowledge of global business operations, financial management, and international markets. The program
covers key areas such as economics, accounting, marketing, and cross-border finance. Students learn to navigate the
complexities of international trade, finance, and business strategies. This course prepares graduates for diverse careers
in multinational companies, financial institutions, and global consulting firms.

[Bachelor of Entrepreneurship]
Bachelor of Entrepreneurship is a 3-4 year undergraduate course designed for students who aspire to start and
manage their own businesses. The course covers essential topics such as business planning, financial management,
marketing, and innovation. It equips students with the skills needed to identify opportunities, develop business
strategies, and manage ventures. This program fosters creativity and leadership, preparing students for entrepreneurial
careers or roles in business development and management.

[BA Psychology]
BA in Psychology is a 3-year undergraduate course that explores the science of human behavior and mind. Students
learn about various psychological concepts, including cognitive, developmental, social, and abnormal psychology. The
course also covers research methods and practical applications of psychology in areas such as mental health,
education, and counseling. It provides a strong foundation for those interested in pursuing careers in counseling,
therapy, human resources, or research in psychology.

[Bachelor of Counselling and Psychology]
Bachelor of Counselling and Psychology is a 3-year undergraduate program designed to provide students with an
understanding of human behavior, mental health, and therapeutic techniques. The course covers topics like
psychology, counseling theories, mental health issues, and communication skills. It prepares students for careers in
counseling, therapy, and psychological support roles. This program equips students with the necessary skills to help
individuals cope with emotional, psychological, and social challenges in various settings.

[BA in Clinical Psychology]
BA in Clinical Psychology is a 3-year undergraduate course that introduces students to the principles of mental
health, behavior, and human psychology. The course covers topics like psychological assessment, therapy techniques,
mental disorders, and counseling. Students gain a foundational understanding of how to assess, treat, and support
individuals facing psychological challenges. It prepares students for further specialization in clinical psychology or
related fields, opening up opportunities in healthcare, counseling, and mental health support careers.

[Bachelor of Arts in Counseling]
Bachelor of Arts in Counseling is a 3-year undergraduate course that focuses on understanding human behavior and
providing psychological support. Students learn various counseling techniques, communication skills, and the
principles of mental health. The program covers subjects such as psychology, mental health disorders, and therapeutic
practices. It prepares students for careers in counseling, therapy, and mental health services, equipping them with the
skills to help individuals overcome personal challenges and improve their well-being.

[BA in Social Psychology]
BA in Social Psychology is a 3-year undergraduate program that explores the interaction between individuals and
society. It focuses on understanding how social influences, group dynamics, and cultural factors shape human
behavior. Students learn about topics such as attitudes, prejudice, social perception, and human interaction. This
course equips students with the knowledge to analyze social issues and apply psychological principles to real-world
scenarios, preparing them for careers in social research, counseling, and community services.

[BA in Forensic Psychology]
BA in Forensic Psychology is a 3-year undergraduate course that blends psychology with the criminal justice system.
Students explore the psychological aspects of criminal behavior, investigation techniques, and the legal system. The
program covers topics such as criminal law, mental health assessment, and forensic science. Graduates are equipped to
work in criminal investigations, law enforcement, and rehabilitation services, offering valuable insights into the
behavior of offenders and victims.

[Bachelor of Performing Arts (BPA)]
Bachelor of Performing Arts (BPA) is a dynamic undergraduate program that focuses on the development of skills
in dance, music, and drama. The course provides students with a strong foundation in various performing arts
techniques and theory, while encouraging creativity and artistic expression. Through practical training and
performances, students enhance their talent and gain a deep understanding of the cultural significance of the arts. This
program opens doors to careers in the entertainment industry, arts management, and teaching.

[Bachelor of Music]
Bachelor of Music (B.Mus.) is a 3-4 year undergraduate program designed for students passionate about music. It
focuses on developing skills in music theory, performance, composition, and music history. The course covers various
musical genres, including classical, contemporary, and world music. It prepares students for careers as musicians,
composers, music educators, and sound engineers, providing a strong foundation for those looking to pursue advanced
studies or professional work in the music industry.

[Bachelor of Dance]
Bachelor of Dance is a 3-year undergraduate course that focuses on developing dance skills, techniques, and
knowledge of various dance forms. Students explore both classical and contemporary dance styles, learning
choreography, performance, and the history of dance. The program enhances creativity, physical fitness, and artistic
expression. It prepares students for careers as professional dancers, choreographers, or dance instructors, offering
opportunities in the entertainment, education, and cultural sectors.

[BA Public Policy]
BA in Public Policy is a 3-year undergraduate course that provides students with an understanding of the principles of
governance, public administration, and policy analysis. The program covers subjects such as political science,
economics, law, and policy formulation, focusing on how policies impact society. It equips students with the
knowledge to address public issues, make informed decisions, and contribute to public welfare. This degree prepares
graduates for careers in government, NGOs, think tanks, and public sector organizations.

[BA Governance and Public Administration]
BA in Governance and Public Administration is a 3-year undergraduate course that focuses on the functioning of
governments, public policies, and administrative processes. Students gain an understanding of governance systems,
political structures, and public management. The course includes subjects like public policy, ethics in governance, and
international relations, preparing students for roles in government, NGOs, and public sector organizations. It equips
students with the knowledge to manage public resources and contribute to societal development through effective
administration.

[Bachelor of Development Studies]
Bachelor of Development Studies is a 3-year undergraduate course that focuses on understanding and addressing
global development challenges. The program covers topics such as poverty, social inequality, sustainable
development, and public policy. Students learn about the economic, political, and social aspects of development,
preparing them for roles in NGOs, government organizations, and international agencies. This course equips students
with the knowledge and skills to contribute to the improvement of communities and societies worldwide.

[BA in International Development]
BA in International Development is a 3-year undergraduate program that focuses on global issues such as poverty,
inequality, and sustainable development. The course covers subjects like economics, international relations, human
rights, and development policies. Students gain a deep understanding of the social, economic, and political challenges
faced by developing countries. This degree prepares graduates for careers in NGOs, international organizations,
policy-making, and community development, enabling them to contribute to creating positive change globally.

[BA in Rural Development]
BA in Rural Development is a 3-year undergraduate course that focuses on understanding and addressing the
challenges faced by rural communities. The program covers topics such as rural economics, sustainable development,
agriculture, and social welfare. Students gain knowledge and skills to work in rural development organizations,
government agencies, and NGOs. It equips them to create and implement programs aimed at improving living
standards and promoting growth in rural areas. This course offers a rewarding career path in social development and
community welfare.

[BA in Urban Studies]
BA in Urban Studies is a 3-year undergraduate course that focuses on the study of urban development, planning, and
the challenges faced by cities. The course covers subjects like urban sociology, public policy, environmental
sustainability, and city governance. It provides students with an understanding of urban spaces, their dynamics, and
the impact of urbanization. Graduates of this program can pursue careers in urban planning, policy-making, and
sustainable development, contributing to the growth and development of cities.

[BA in Social Work with a focus on Development]
BA in Social Work with a Focus on Development is a 3-year undergraduate course that combines theory and
practical training to address social issues and promote community development. The course covers topics such as
social welfare, human rights, social policies, and sustainable development. It equips students with the skills needed to
work in various sectors such as NGOs, government agencies, and social service organizations. This program prepares
students to contribute meaningfully to social change and community empowerment.

[BA in Human Rights]
BA in Human Rights is a 3-year undergraduate course that focuses on the study of human rights laws, ethics, and
their global impact. The program covers topics such as social justice, international human rights, and the protection of
civil liberties. It aims to develop critical thinking and analytical skills, empowering students to work in human rights
advocacy, policy-making, and international organizations. This degree opens doors to careers in human rights law,
NGOs, government, and social activism.

[BBA in Tourism and Hospitality]
BBA in Tourism and Hospitality is a 3-year undergraduate course designed to provide students with in-depth
knowledge of the tourism, hospitality, and event management industries. The course covers areas such as customer
service, travel management, hotel operations, and tourism marketing. It equips students with the skills needed to
manage and run tourism-related businesses. Graduates can explore career opportunities in hotels, travel agencies,
event planning, and tourism organizations.

[B.Sc. in Hospitality and Hotel Administration]
B.Sc. in Hospitality and Hotel Administration is a 3-year undergraduate course that trains students in the
management and operations of hotels, restaurants, and the hospitality industry. The program covers key areas such as
food and beverage management, tourism, front office operations, and hospitality law. Students gain practical
experience in customer service, event management, and business administration, preparing them for leadership roles in
the hospitality sector. This course offers excellent career opportunities in hotels, resorts, event management, and
tourism.

[Bachelor of Tourism Studies]
Bachelor of Tourism Studies is a 3-year undergraduate course designed for students interested in the tourism and
hospitality industry. The program covers key areas like travel management, tourism marketing, cultural heritage, and
sustainable tourism. Students gain in-depth knowledge about the tourism sector, including its economic, social, and
environmental aspects. This course opens up career opportunities in travel agencies, tour operations, event
management, and tourism consultancy.

[Bachelor of Arts in Tourism Administration]
Bachelor of Arts in Tourism Administration is a 3-year undergraduate course designed to equip students with the
knowledge and skills needed for the dynamic tourism industry. The program covers subjects such as tourism
management, hospitality, event planning, and travel regulations. Students learn how to manage travel destinations,
promote tourism, and ensure the smooth operation of tourism-related businesses. This course opens up opportunities
for careers in tourism management, travel agencies, event coordination, and hospitality.

[BBA in Event Management and PR]
BBA in Event Management and PR is a 3-year undergraduate course that combines the study of business
administration with event planning and public relations. It covers key areas such as marketing, communication,
branding, event coordination, and media relations. This program equips students with the skills needed to manage
events, handle client relations, and promote organizations. Graduates can pursue careers in event management
agencies, PR firms, corporate communications, and entertainment sectors.

[Bachelor of Library Science (B.Lib.Sc.)]
Bachelor of Library Science (B.Lib.Sc.) is a one-year undergraduate course that focuses on the management of
library resources and information systems. Students learn about cataloging, archiving, library administration, and
information retrieval. The program prepares individuals for careers in libraries, archives, museums, and information
management sectors. It equips students with essential skills for organizing, preserving, and providing access to
information, both digitally and physically.

[Bachelor of Library and Information Science (B.L.I.Sc.)]
Bachelor of Library and Information Science (B.L.I.Sc.) is a one-year undergraduate course that equips students
with the skills to manage and organize information in libraries and information centers. The program covers topics
like information retrieval, cataloging, library management, and digital resources. It prepares students for careers in
libraries, archives, and information management sectors. This course is ideal for those interested in information
science and the management of resources for educational or organizational purposes.

[BA in Library Science and Information Management]
BA in Library Science and Information Management is a 3-year undergraduate course that focuses on managing
library resources, organizing information, and using digital technologies to store and retrieve data. The program
covers subjects such as information systems, cataloging, archiving, and library administration. It prepares students for
careers in libraries, information centers, and data management roles, helping them develop skills in organizing,
preserving, and providing access to knowledge. This course opens up opportunities in various sectors like education,
research, and government organizations.

[BA in Gender Studies]
BA in Gender Studies is a 3-year undergraduate course that explores the social, cultural, and political aspects of
gender. The program examines topics such as gender equality, feminism, LGBTQ+ rights, and the role of gender in
